<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SmartWay Final Invoice</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#d9e2ec;font-family:Arial,sans-serif;color:#102c4a}
.bar{position:sticky;top:0;z-index:10;background:#222;padding:10px;text-align:center}
button{margin:0 5px;padding:9px 18px;font-weight:bold;font-size:14px}
.sheet{width:900px;min-height:1120px;margin:15px auto;background:white;padding:22px;box-shadow:0 2px 12px #777}
.header{display:flex;justify-content:space-between;align-items:center}
.logo{font-size:70px;font-weight:bold;font-style:italic;color:#173d8f}
.logo span{color:#e44732}
.company{text-align:right;line-height:1.45}
.company h2{margin:0;color:#173d8f}
.title{text-align:center;background:#aebfd8;color:#000;font-size:34px;font-weight:bold;padding:6px;margin:15px 0}
.details{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.box{border:1px solid #647d9e}
.box h3{background:#aebfd8;margin:0;padding:7px;color:#102c4a}
.row{display:grid;grid-template-columns:145px 1fr;border-top:1px solid #aab6c5;min-height:38px;align-items:center}
.label{font-weight:bold;padding:7px}
input{width:100%;border:0;padding:7px;font-size:14px;background:#fff;outline:none}
table{width:100%;border-collapse:collapse;margin-top:12px}
th,td{border:1px solid #8193aa;padding:0;text-align:center;height:36px}
th{background:#aebfd8;padding:7px 3px}
td input{text-align:center;height:34px;padding:4px}
td.desc input{text-align:left}
.summary{display:grid;grid-template-columns:2fr 1fr;margin-top:10px;gap:8px}
.words,.totals{border:1px solid #8193aa}
.words h3{background:#aebfd8;margin:0;padding:7px}
.words div{padding:15px;font-weight:bold;min-height:80px}
.totalrow{display:grid;grid-template-columns:1.5fr 1fr;border-bottom:1px solid #8193aa}
.totalrow b{padding:8px}
.totalrow span{padding:8px;text-align:right;font-weight:bold}
.bank,.terms{border:1px solid #8193aa;margin-top:10px;padding:10px}
.bank h3,.terms h3{background:#aebfd8;margin:-10px -10px 10px;padding:7px}
